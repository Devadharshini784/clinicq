spring:
  application:
    name: clinicq-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/clinicq
    username: clinicq
    password: clinicq_dev_password

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-this-must-be-32-chars-or-more}
    expiration-ms: 28800000
  queue:
    default-consultation-seconds: 300