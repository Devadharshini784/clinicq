spring:
  application:
    name: clinicq-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/clinicq
    username: clinicq
    password: clinicq_dev_password

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info