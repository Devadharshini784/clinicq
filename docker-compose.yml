services:
  postgres:
    image: postgres:16
    container_name: clinicq-postgres
    environment:
      POSTGRES_DB: clinicq
      POSTGRES_USER: clinicq
      POSTGRES_PASSWORD: clinicq_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicq -d clinicq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: clinicq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: